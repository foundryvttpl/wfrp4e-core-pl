on:
  pull_request:
    branches:
      - main
    types:
      - closed

name: Publish Production Release

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    name: Publish approved synchronization
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/sync-from-development' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Verify approval of synchronized commit
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const approved = reviews.some((review) =>
              review.state === 'APPROVED' && review.commit_id === pullRequest.head.sha
            );
            if (!approved) {
              core.setFailed(
                `Pull request #${pullRequest.number} was merged without an approval ` +
                `for its final synchronized commit ${pullRequest.head.sha}.`
              );
            }

      - name: Validate release version and provenance
        id: provenance
        env:
          SOURCE_REPOSITORY_TOKEN: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$SOURCE_REPOSITORY_TOKEN" ]; then
            echo "SOURCE_REPOSITORY_TOKEN is not configured." >&2
            exit 1
          fi

          python3 << 'PY'
          import json
          import os
          import re

          with open('module.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          with open('release-source.json', encoding='utf-8') as handle:
              provenance = json.load(handle)

          version = str(manifest.get('version', '')).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Production version must use X.Y.Z format, got {version!r}')
          if provenance.get('version') != version:
              raise SystemExit('release-source.json version does not match module.json')
          if provenance.get('source_repository') != 'foundryvttpl/wfrp4e-core-pl-pre':
              raise SystemExit('release-source.json contains an unexpected source repository')

          source_commit = str(provenance.get('source_commit', ''))
          if not re.fullmatch(r'[0-9a-f]{40,64}', source_commit):
              raise SystemExit('release-source.json contains an invalid source commit')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
              output.write(f'release_tag=v{version}\n')
              output.write(f'source_commit={source_commit}\n')
          PY

      - name: Prepare release version
        id: get_version
        env:
          VERSION: ${{ steps.provenance.outputs.version }}
          RELEASE_TAG: ${{ steps.provenance.outputs.release_tag }}
        run: |
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version-without-v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create production tag
        id: production_tag
        env:
          RELEASE_TAG: ${{ steps.provenance.outputs.release_tag }}
        run: |
          set -euo pipefail
          production_commit=$(git rev-parse HEAD)
          existing_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)

          if [ -n "$existing_commit" ] && [ "$existing_commit" != "$production_commit" ]; then
            echo "$RELEASE_TAG already points to $existing_commit instead of $production_commit" >&2
            exit 1
          fi

          if [ -z "$existing_commit" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Production release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            echo "$RELEASE_TAG already points to the merged synchronization commit."
          fi

          echo "production_commit=$production_commit" >> "$GITHUB_OUTPUT"

      - name: Modify Module Manifest With Release-Specific Values
        id: sub_manifest_link_version
        uses: microsoft/variable-substitution@v1
        with:
          files: './module.json'
        env:
          version: ${{steps.get_version.outputs.version-without-v}}
          url: https://github.com/${{github.repository}}
          manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
          download: https://github.com/${{github.repository}}/releases/download/${{steps.get_version.outputs.version}}/wfrp4e-core-pl.zip

      - name: Zip files
        run: |
          zip -r wfrp4e-core-pl.zip module.json release-source.json RELEASE_TAGGING.md babele-register.js load-scripts-pl.js gazetteer.json modules/ lang/ images/ fonts/ css/ compendium/

      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: Release ${{steps.get_version.outputs.version}}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./release-source.json, ./wfrp4e-core-pl.zip'
          tag: ${{ steps.provenance.outputs.release_tag }}

      - name: Get Module ID
        id: moduleID
        uses: notiz-dev/github-action-json-property@release
        with:
          path: './module.json'
          prop_path: 'id'

      - name: Get mininum
        id: minimum
        uses: notiz-dev/github-action-json-property@release
        with:
          path: './module.json'
          prop_path: 'compatibility.minimum'

      - name: Get verified
        id: verified
        uses: notiz-dev/github-action-json-property@release
        with:
          path: './module.json'
          prop_path: 'compatibility.verified'

      - name: Get maximum
        id: maximum
        uses: notiz-dev/github-action-json-property@release
        with:
          path: './module.json'
          prop_path: 'compatibility.maximum'

      - name: Foundry Release API
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.foundryvtt.com/_api/packages/release_version'
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json", "Authorization" : "${{ secrets.FOUNDRY_KEY }}"}'
          data: '{"dry_run": false, "id": "${{steps.moduleID.outputs.prop}}", "release": {"version":  "${{steps.get_version.outputs.version-without-v}}", "manifest": "https://github.com/${{github.repository}}/releases/download/${{steps.get_version.outputs.version}}/module.json", "compatibility" : {"minimum": "${{steps.minimum.outputs.prop}}", "verified": "${{steps.verified.outputs.prop}}", "maximum": "${{steps.maximum.outputs.prop}}"}}}'

      - name: Check out synchronized development commit
        uses: actions/checkout@v4
        with:
          repository: foundryvttpl/wfrp4e-core-pl-pre
          ref: ${{ steps.provenance.outputs.source_commit }}
          token: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          fetch-depth: 0
          path: development-source

      - name: Tag development commit with production version
        env:
          VERSION: ${{ steps.provenance.outputs.version }}
          PRODUCTION_COMMIT: ${{ steps.production_tag.outputs.production_commit }}
        run: |
          set -euo pipefail
          cd development-source

          tag="production/v${VERSION}"
          source_commit=$(git rev-parse HEAD)
          existing_commit=$(git rev-list -n 1 "$tag" 2>/dev/null || true)

          if [ -n "$existing_commit" ]; then
            if [ "$existing_commit" != "$source_commit" ]; then
              echo "$tag already points to $existing_commit instead of $source_commit" >&2
              exit 1
            fi
            echo "$tag already points to the synchronized development commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Production release v${VERSION} from ${PRODUCTION_COMMIT}"
          git push origin "refs/tags/$tag"
